[package]
name = "sbot-desktop"
version = "0.0.1"
authors = ["while"]
edition = "2021"

[lib]
name = "sbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
