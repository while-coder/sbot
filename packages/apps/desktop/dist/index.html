<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBot</title>
  <style>
    /* Vue 挂载前的品牌 loading 骨架：bundle 加载期间不白屏，挂载后整体替换 */
    html, body { margin: 0; height: 100%; background: #fafafa; color-scheme: light; }
    #boot {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #5f6368;
      font-size: 13px;
    }
    #boot .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; color: #1f2328; }
    #boot .spinner {
      width: 22px; height: 22px;
      border: 2px solid #d0d3d8;
      border-top-color: #1f2328;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" crossorigin src="./assets/index-bk-CamN-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DBNpmZka.css">
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="logo">SBot</div>
      <div class="spinner" aria-hidden="true"></div>
      <p>正在启动…</p>
    </div>
  </div>
</body>
</html>
